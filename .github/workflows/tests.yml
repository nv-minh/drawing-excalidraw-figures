name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dựng bundle Excalidraw
        # .cache/exca.bundle.js không còn trong repo (cảnh báo quét secret của
        # GitHub trên cấu hình Firebase công khai của Excalidraw): dựng 1 lần
        # trước khi test, ~30s. Fonts (assets/fonts/) vẫn có sẵn trong repo.
        run: |
          npm install --no-audit --no-fund
          npm run bundle
      - name: Cài dependencies
        run: |
          pip install -r requirements.txt pytest
          python -m playwright install chromium --with-deps
      - name: Chạy tests
        run: python -m pytest -v
